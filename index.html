<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐝 VespaTimer v1.1</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f2e6; margin: 0; padding: 10px; }
        .card { background: white; border-radius: 16px; padding: 14px; margin: 10px 0; }
        button { padding: 12px 20px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; margin: 4px; font-size: 16px; }
        button:active { background: #ccc; }
        .gold { background: #d4a853; color: white; }
        .red { background: #c47b6b; color: white; }
        .grey { background: #ddd; }
        .hornet { border: 2px solid #e7d7b8; border-radius: 12px; padding: 10px; margin: 8px 0; background: #fefaf2; }
        .timer { font-size: 24px; font-weight: bold; background: #eee; padding: 8px 16px; border-radius: 20px; display: inline-block; }
        #map { height: 300px; border-radius: 12px; background: #ddd; }
        select, input { font-size: 16px; padding: 8px; border-radius: 12px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>🐝 VespaTimer v1.1</h1>

    <select id="langSelect" onchange="changeLang()">
        <option value="fr">🇫🇷 Français</option>
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
    </select>

    <div class="card">
        <strong>📍 Pot-à-Mèche:</strong> <span id="locDisplay">46.8, 6.8</span><br>
        <input id="locInput" placeholder="Lieu ou lat,lng" style="width:200px;">
        <button class="gold" onclick="setLoc()">Enregistrer</button>
        <button class="grey" onclick="getGps()">📍 GPS</button>
    </div>

    <div class="card">
        <h3>🐝 Frelons</h3>
        <div id="hornets"></div>
        <button class="grey" onclick="addHornet()">+ Ajouter</button>
    </div>

    <div class="card">
        <h3>🗺️ Carte</h3>
        <div id="map"></div>
        <button class="grey" onclick="showHistory()">📋 Historique</button>
        <button class="red" onclick="clearMap()">🗑️ Effacer</button>
        <div id="predictions"></div>
    </div>

    <div class="card">
        <h3>📊 Stats</h3>
        <div id="stats"></div>
    </div>

    <div class="card">
        <button class="grey" onclick="exportJSON()">📤 JSON</button>
        <button class="grey" onclick="exportGPX()">📍 GPX</button>
        <button class="grey" onclick="exportKML()">🌍 KML</button>
        <button class="grey" onclick="document.getElementById('imp').click()">📥 Importer</button>
        <button class="red" onclick="resetAll()">🔄 Reset</button>
        <input type="file" id="imp" accept=".json" style="display:none;" onchange="importData(event)">
    </div>

    <script>
        // ===== DATA =====
        let hornets = [{ id: 1, name: 'Frelon 1', dir: 0, flights: [], running: false, start: null, elapsed: 0 }];
        let loc = { lat: 46.8, lng: 6.8, name: '' };
        let lang = 'fr';
        let map, marker, lines = [];
        const colors = ['#d4a853', '#b85c3a', '#5f7d6b', '#7b5e7b', '#3a6b8c'];

        // ===== TRANSLATIONS =====
        const t = {
            fr: { ready: 'Prêt', running: 'En cours', flights: 'vols', avg: 'Moy', dist: 'Dist', noData: 'Aucun vol',
                addFlights: 'Ajoutez des vols', priority: 'Zone prioritaire', importOk: '✅ Importé!',
                importFail: '❌ Erreur', gpsFail: '❌ GPS non disponible', maxHornets: 'Max 5 frelons',
                confirmReset: 'Tout effacer ?' },
            en: { ready: 'Ready', running: 'Running', flights: 'flights', avg: 'Avg', dist: 'Dist', noData: 'No flights',
                addFlights: 'Add flights', priority: 'Priority zone', importOk: '✅ Imported!',
                importFail: '❌ Error', gpsFail: '❌ GPS unavailable', maxHornets: 'Max 5 hornets',
                confirmReset: 'Delete all?' },
            de: { ready: 'Bereit', running: 'Läuft', flights: 'Flüge', avg: 'Mittel', dist: 'Entf', noData: 'Keine Flüge',
                addFlights: 'Flüge hinzufügen', priority: 'Prioritätszone', importOk: '✅ Importiert!',
                importFail: '❌ Fehler', gpsFail: '❌ GPS nicht verfügbar', maxHornets: 'Max 5 Hornissen',
                confirmReset: 'Alles löschen?' },
            it: { ready: 'Pronto', running: 'In corso', flights: 'voli', avg: 'Media', dist: 'Dist', noData: 'Nessun volo',
                addFlights: 'Aggiungi voli', priority: 'Zona prioritaria', importOk: '✅ Importato!',
                importFail: '❌ Errore', gpsFail: '❌ GPS non disponibile', maxHornets: 'Max 5 calabroni',
                confirmReset: 'Cancellare tutto?' }
        };

        function _(key) { return (t[lang] && t[lang][key]) || key; }

        function changeLang() { lang = document.getElementById('langSelect').value;
            localStorage.setItem('v_lang', lang);
            render(); }

        // ===== HORNET FUNCTIONS =====
        function avg(h) { return h.flights.length ? h.flights.reduce((a, b) => a + b, 0) / h.flights.length : 0; }

        function dist(h) { const a = avg(h); return a > 30 ? (a - 30) * 2.5 : 0; }

        function startTimer(id) {
            const h = hornets.find(x => x.id === id);
            if (!h || h.running || h.flights.length >= 5) return;
            h.running = true;
            h.start = Date.now() - (h.elapsed * 1000);
            render();
        }

        function stopTimer(id) {
            const h = hornets.find(x => x.id === id);
            if (!h || !h.running) return;
            const el = Math.floor((Date.now() - h.start) / 1000);
            h.running = false;
            h.start = null;
            if (el > 0) { h.flights.push(el); if (h.flights.length > 5) h.flights.shift(); }
            h.elapsed = 0;
            saveHist();
            render();
        }

        function resetTimer(id) {
            const h = hornets.find(x => x.id === id);
            if (!h) return;
            h.running = false;
            h.start = null;
            h.elapsed = 0;
            render();
        }

        function delFlight(id) {
            const h = hornets.find(x => x.id === id);
            if (h && h.flights.length) { h.flights.pop();
                render(); }
        }

        function updateDir(id, val) {
            const h = hornets.find(x => x.id === id);
            if (h) { h.dir = Math.min(359, Math.max(0, parseInt(val) || 0));
                render(); }
        }

        function updateName(id, val) {
            const h = hornets.find(x => x.id === id);
            if (h) { h.name = val || 'Frelon';
                render(); }
        }

        function addHornet() {
            if (hornets.length >= 5) { alert(_('maxHornets')); return; }
            hornets.push({ id: Date.now(), name: 'Frelon ' + (hornets.length + 1), dir: 0, flights: [], running: false,
                start: null, elapsed: 0 });
            render();
        }

        // ===== STORAGE =====
        function save() {
            localStorage.setItem('v_data', JSON.stringify({ hornets, loc }));
        }

        function load() {
            try {
                const d = JSON.parse(localStorage.getItem('v_data'));
                if (d && d.hornets) hornets = d.hornets;
                if (d && d.loc) loc = d.loc;
            } catch (e) {}
            const sl = localStorage.getItem('v_lang');
            if (sl && t[sl]) { lang = sl;
                document.getElementById('langSelect').value = lang; }
            if (!hornets.length) hornets.push({ id: 1, name: 'Frelon 1', dir: 0, flights: [], running: false, start: null,
                elapsed: 0 });
        }

        function saveHist() {
            if (!hornets.some(h => h.flights.length)) return;
            let hist = [];
            try { hist = JSON.parse(localStorage.getItem('v_hist') || '[]'); } catch (e) {}
            hist.push({ date: new Date().toISOString(), loc: { ...loc }, hornets: hornets.map(h => ({ name: h.name,
                    dir: h.dir, flights: [...h.flights] })) });
            if (hist.length > 50) hist = hist.slice(-50);
            localStorage.setItem('v_hist', JSON.stringify(hist));
        }

        function getHist() { try { return JSON.parse(localStorage.getItem('v_hist') || '[]'); } catch (e) { return []; } }

        // ===== LOCATION =====
        function setLoc() {
            const v = document.getElementById('locInput').value.trim();
            if (!v) return;
            loc.name = v;
            const m = v.match(/([-+]?\d+\.?\d*)\s*[,;]\s*([-+]?\d+\.?\d*)/);
            if (m) { loc.lat = +m[1];
                loc.lng = +m[2]; }
            updateMarker();
            render();
        }

        function getGps() {
            if (!navigator.geolocation) { alert(_('gpsFail')); return; }
            navigator.geolocation.getCurrentPosition(p => {
                loc.lat = p.coords.latitude;
                loc.lng = p.coords.longitude;
                document.getElementById('locInput').value = loc.lat.toFixed(5) + ', ' + loc.lng.toFixed(5);
                updateMarker();
                render();
            }, () => alert(_('gpsFail')), { enableHighAccuracy: true });
        }

        // ===== MAP =====
        function initMap() {
            const el = document.getElementById('map');
            if (!el || map) return;
            map = L.map('map').setView([loc.lat, loc.lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            updateMarker();
        }

        function updateMarker() {
            if (!map) return;
            if (marker) map.removeLayer(marker);
            marker = L.marker([loc.lat, loc.lng], { draggable: true }).addTo(map).bindPopup('📍 Pot-à-Mèche').openPopup();
            marker.on('dragend', e => { loc.lat = e.target.getLatLng().lat;
                loc.lng = e.target.getLatLng().lng;
                save();
                drawLines(); });
        }

        function clearMap() {
            if (!map) return;
            lines.forEach(l => map.removeLayer(l));
            lines = [];
            document.getElementById('predictions').textContent = '⚠️ ' + _('addFlights');
        }

        function drawLines(hist) {
            if (!map) return;
            lines.forEach(l => { if (map.hasLayer(l)) map.removeLayer(l); });
            lines = [];
            const preds = [];

            hornets.forEach((h, i) => {
                if (!h.flights.length) return;
                const d = dist(h);
                if (d <= 0) return;
                const dkm = d / 1000;
                const rad = (h.dir * Math.PI) / 180;
                const p = L.latLng(loc.lat, loc.lng);
                const n = L.latLng(p.lat + (dkm / 111.32) * Math.cos(rad), p.lng + (dkm / (111.32 * Math.cos(p.lat *
                    Math.PI / 180))) * Math.sin(rad));
                lines.push(L.polyline([p, n], { color: colors[i % 5], weight: 3, dashArray: '5,5' }).addTo(map));
                lines.push(L.circleMarker(n, { radius: 7, color: colors[i % 5], fillOpacity: 0.7 }).addTo(map)
                    .bindPopup(h.name + '<br>~' + d.toFixed(0) + 'm'));
                preds.push({ name: h.name, pt: n, d: d });
            });

            if (hist) hist.forEach(e => {
                if (!e.loc || !e.hornets) return;
                e.hornets.forEach(hh => {
                    if (!hh.flights.length) return;
                    const a = hh.flights.reduce((x, y) => x + y, 0) / hh.flights.length;
                    const dd = a > 30 ? (a - 30) * 2.5 : 0;
                    if (dd <= 0) return;
                    const dkm = dd / 1000;
                    const rad = (hh.dir * Math.PI) / 180;
                    const p = L.latLng(e.loc.lat, e.loc.lng);
                    const n = L.latLng(p.lat + (dkm / 111.32) * Math.cos(rad), p.lng + (dkm / (111.32 * Math.cos(p.lat *
                        Math.PI / 180))) * Math.sin(rad));
                    lines.push(L.circleMarker(n, { radius: 3, color: '#999', fillOpacity: 0.4 }).addTo(map)
                        .bindPopup('Hist: ' + new Date(e.date).toLocaleDateString()));
                });
            });

            if (preds.length >= 2) {
                const clat = preds.reduce((s, p) => s + p.pt.lat, 0) / preds.length;
                const clng = preds.reduce((s, p) => s + p.pt.lng, 0) / preds.length;
                const icon = L.divIcon({ html: '⭐', iconSize: [30, 30], iconAnchor: [15, 15], className: '' });
                lines.push(L.marker([clat, clng], { icon }).addTo(map).bindPopup(_('priority')));
            }

            document.getElementById('predictions').textContent = preds.length ?
                '🔍 ' + preds.map(p => p.name + ' → ~' + p.d.toFixed(0) + 'm').join(' · ') :
                '⚠️ ' + _('addFlights');
        }

        function showHistory() {
            const hist = getHist().filter(e => new Date(e.date) > Date.now() - 15 * 86400000);
            drawLines(hist);
        }

        // ===== EXPORT =====
        function dl(b, n) { const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = n;
            a.click(); }

        function exportJSON() {
            dl(new Blob([JSON.stringify({ hornets, loc, date: new Date().toISOString() })], { type: 'application/json' }),
                'vespatimer.json');
        }

        function exportGPX() {
            let g = '<?xml version="1.0"?><gpx version="1.1" creator="VespaTimer">';
            g +=
            `<wpt lat="${loc.lat}" lon="${loc.lng}"><name>Pot</name></wpt>`;
            hornets.forEach(h => {
                if (!h.flights.length) return;
                const d = dist(h);
                if (d <= 0) return;
                const r = (h.dir * Math.PI) / 180;
                g +=
                    `<wpt lat="${(loc.lat+(d/111320)*Math.cos(r)).toFixed(6)}" lon="${(loc.lng+(d/(111320*Math.cos(loc.lat*Math.PI/180)))*Math.sin(r)).toFixed(6)}"><name>${h.name}</name></wpt>`;
            });
            g += '</gpx>';
            dl(new Blob([g], { type: 'application/gpx+xml' }), 'vespatimer.gpx');
        }

        function exportKML() {
            let k = '<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>';
            k +=
            `<Placemark><name>Pot</name><Point><coordinates>${loc.lng},${loc.lat},0</coordinates></Point></Placemark>`;
            hornets.forEach(h => {
                if (!h.flights.length) return;
                const d = dist(h);
                if (d <= 0) return;
                const r = (h.dir * Math.PI) / 180;
                k +=
                    `<Placemark><name>${h.name}</name><Point><coordinates>${(loc.lng+(d/(111320*Math.cos(loc.lat*Math.PI/180)))*Math.sin(r)).toFixed(6)},${(loc.lat+(d/111320)*Math.cos(r)).toFixed(6)},0</coordinates></Point></Placemark>`;
            });
            k += '</Document></kml>';
            dl(new Blob([k], { type: 'application/vnd.google-earth.kml+xml' }), 'vespatimer.kml');
        }

        function importData(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = ev => {
                try {
                    const d = JSON.parse(ev.target.result);
                    if (d.hornets) hornets = d.hornets.map(h => ({ ...h, running: false, start: null,
                        elapsed: 0 }));
                    if (d.loc) loc = d.loc;
                    updateMarker();
                    render();
                    alert(_('importOk'));
                } catch (ex) { alert(_('importFail')); }
            };
            r.readAsText(f);
            e.target.value = '';
        }

        function resetAll() {
            if (!confirm(_('confirmReset'))) return;
            saveHist();
            hornets = [{ id: Date.now(), name: 'Frelon 1', dir: 0, flights: [], running: false, start: null,
            elapsed: 0 }];
            loc = { lat: 46.8, lng: 6.8, name: '' };
            clearMap();
            updateMarker();
            render();
        }

        // ===== RENDER =====
        function render() {
            document.getElementById('hornets').innerHTML = hornets.map((h, i) => {
                const a = avg(h);
                const d = dist(h);
                const fc = h.flights.length;
                let timeText = '00:00';
                if (h.running && h.start) {
                    const s = Math.floor((Date.now() - h.start) / 1000);
                    timeText = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2,
                    '0');
                }
                const badgeColor = h.running ? '#c47b6b' : (fc > 0 ? '#5f7d6b' : '#d4a853');
                const badgeText = h.running ? '⏳ ' + _('running') : (fc > 0 ? '✅ ' + fc + '/5' : '🆕 ' + _(
                'ready'));
                return `
            <div class="hornet" style="border-left:5px solid ${colors[i%5]};">
              <b><input value="${h.name}" style="border:none;background:none;font-weight:bold;color:${colors[i%5]};width:120px;" onchange="updateName(${h.id},this.value)"></b>
              <span style="background:${badgeColor};color:white;padding:3px 10px;border-radius:12px;font-size:12px;">${badgeText}</span>
              <br>
              🧭 <input type="number" value="${h.dir}" min="0" max="359" style="width:65px;text-align:center;" onchange="updateDir(${h.id},this.value)">°
              <span class="timer">${timeText}</span>
              <br>
              <button class="gold" onclick="startTimer(${h.id})" ${h.running||fc>=5?'disabled':''}>▶ START</button>
              <button onclick="stopTimer(${h.id})" ${!h.running?'disabled':''}>⏹ STOP</button>
              <button class="red" onclick="resetTimer(${h.id})">↺ RESET</button>
              <button onclick="delFlight(${h.id})" ${!fc?'disabled':''}>🗑️</button>
              <br>
              📊 ${_('flights')}: ${fc?h.flights.map(s=>s+'s').join(', '):'—'}
              <br>
              📏 ${_('avg')}: <b>${a.toFixed(1)}s</b> | 🗺️ ${_('dist')}: <b>${d.toFixed(0)}m</b>
            </div>`;
            }).join('');

            document.getElementById('locDisplay').textContent = loc.name || loc.lat.toFixed(5) + ', ' + loc.lng.toFixed(
            5);
            document.getElementById('stats').textContent = hornets.filter(h => h.flights.length).length ?
                hornets.filter(h => h.flights.length).map(h => h.name + ': ' + avg(h).toFixed(1) + 's').join(' | ') :
                _('noData');

            save();
            if (map) drawLines();
        }

        // ===== LIVE UPDATE =====
        setInterval(() => {
            if (hornets.some(h => h.running)) render();
        }, 500);

        // ===== BOOT =====
        load();
        render();
        setTimeout(initMap, 400);
    </script>
</body>
</html>
